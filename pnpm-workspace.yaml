packages:
  - "apps/*"
  - "packages/*"
  - "tenants/*"

# pnpm 11 gates lifecycle scripts (postinstall, etc.) for security. Pre-approve
# the natives we've vetted so a fresh `pnpm install` rebuilds them automatically
# instead of stopping with an `[ERR_PNPM_IGNORED_BUILDS]` warning.
#
# `allowBuilds` (package -> true|false) is pnpm 11's key for this. The old
# `pnpm.onlyBuiltDependencies` field in package.json is no longer read (pnpm
# warns and ignores it), so that redundant copy was removed — this file is now
# the single source of truth for build approval.
allowBuilds:
  # Published SDK artifacts are complete; its lifecycle build is not needed.
  '@google/genai': false
  better-sqlite3: true
  esbuild: true
  inngest-cli: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - openai@6.47.0

# Dependency overrides (pnpm 11 reads them from here, not package.json).
overrides:
  # GHSA-w7jw-789q-3m8p — concurrently@9.2.1 pins shell-quote 1.8.3; every
  # sandbox image ships root node_modules, so the production-executor
  # vulnerability gate (fixable criticals) blocked on it. Drop once
  # concurrently depends on >=1.8.4 itself.
  shell-quote: '>=1.8.4'
