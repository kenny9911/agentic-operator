# Grype configuration consumed by the CI "Block CI on critical
# production-executor-image vulnerabilities" gate (anchore/scan-action, which
# runs grype and auto-loads this file from the repo root).
#
# The exceptions below were recorded against the previous `node:26.5.0-slim`
# base. Their package versions and upstream status are historical evidence,
# not verified findings for the current Node 26.8.1 base:
# docker.io/library/node@sha256:c0753125a3789977aefe869cbebccf70e3cfd7ea84ca48547458f02e4f1d7146
# Revalidate these exceptions against a fresh image scan before release and
# remove entries fixed by the new base. The dependency lockfile also needs
# a fresh scan; the prior clean result does not cover the upgraded packages.
#
# Explicit, documented risk acceptance for the sandboxed CodeAct executor.
# Re-audit on every base-image bump and drop any entry a newer base fixes.
ignore:
  # Previous-base finding: perl-base 5.40.1-6 (Debian) — no upstream fix then.
  - vulnerability: CVE-2026-13221 # perl: silently-incorrect regex compilation
  - vulnerability: CVE-2026-42496 # perl-archive-tar: symlink path traversal (wont-fix)
  - vulnerability: CVE-2026-57433 # perl Storable: signed integer overflow
  - vulnerability: CVE-2026-8376 # perl: heap overflow compiling regex on 32-bit (image is amd64)
  - vulnerability: CVE-2026-12087 # perl-base: additional critical, not-fixed
  # Previous-base finding: glibc 2.41-12+deb13u3 — Debian marked wont-fix then.
  - vulnerability: CVE-2026-5450 # glibc: wont-fix upstream
  # Previous-base finding: Node's global npm bundled tar 7.5.16 (fixed in
  # 7.5.19), separate from the application's tar dependency.
  - vulnerability: GHSA-23hp-3jrh-7fpw # node-tar DoS via crafted gzip bomb (grype id)
  - vulnerability: CVE-2026-59873 # same node-tar DoS (nvd id alias, for robustness)
